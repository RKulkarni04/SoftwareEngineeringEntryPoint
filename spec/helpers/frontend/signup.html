<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - EntryPoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="flex flex-col min-h-screen bg-white text-gray-800">

    <header class="flex items-center px-8 py-4 border-b border-gray-100 shadow-sm bg-white">
        <a href="landing.html" class="px-4 py-2 text-sm font-medium text-white bg-green-500 rounded-lg hover:bg-green-600 transition">
            Home
        </a>
    </header>

    <main class="flex-1 flex items-center justify-center px-6 py-16 bg-gradient-to-b from-white to-green-50">
        <div class="w-full max-w-md bg-white border border-gray-100 rounded-2xl shadow-sm p-8">
            <h1 class="text-3xl font-bold text-center text-gray-900 mb-6">Create an Account</h1>

            <div id="messageBox" class="hidden text-sm mb-4 px-4 py-3 rounded-lg"></div>

            <div class="flex flex-col gap-4">
                <input type="text" id="signup-name" placeholder="Full name"
                       class="px-4 py-3 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">

                <input type="email" id="signup-email" placeholder="Email address"
                       class="px-4 py-3 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">

                <input type="password" id="signup-password" placeholder="Password"
                       class="px-4 py-3 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">

                <button type="button" id="signup-submit"
                        class="px-4 py-3 text-sm font-medium text-white bg-green-500 rounded-lg hover:bg-green-600 transition">
                    Create Account
                </button>

                <p class="text-sm text-center text-gray-500">
                    Already have an account?
                    <a href="login.html" class="text-green-600 hover:underline">Log in</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('signup-submit').addEventListener('click', async function () {
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value.trim();
            const messageBox = document.getElementById('messageBox');

            messageBox.classList.add('hidden');
            messageBox.classList.remove('error-message');

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                messageBox.classList.remove('hidden');

                if (response.ok) {
                    messageBox.className = 'text-sm mb-4 px-4 py-3 rounded-lg bg-green-50 text-green-700';
                    messageBox.textContent = data.message || 'Account created successfully';
                    const loginRes = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const loginData = await loginRes.json();
                    if (loginRes.ok && loginData.token) {
                        localStorage.setItem('token', loginData.token);
                        localStorage.setItem('userId', loginData.userId);
                        window.location.href = 'dashboard.html';
                    } else {
                        setTimeout(function () {
                            window.location.href = 'login.html';
                        }, 800);
                    }
                } else {
                    messageBox.className = 'error-message text-sm mb-4 px-4 py-3 rounded-lg bg-red-50 text-red-700';
                    messageBox.textContent = data.error || 'Signup failed';
                }
            } catch (err) {
                messageBox.classList.remove('hidden');
                messageBox.className = 'error-message text-sm mb-4 px-4 py-3 rounded-lg bg-red-50 text-red-700';
                messageBox.textContent = 'Server error. Please try again.';
            }
        });
    </script>
</body>
</html>
