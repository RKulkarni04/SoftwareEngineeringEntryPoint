<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EntryPoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-b from-white to-green-50 flex flex-col items-center justify-center px-6">

    <a href="landing.html" class="absolute top-6 left-8 text-sm text-green-600 hover:underline">Home</a>

    <div class="w-full max-w-md bg-white border border-gray-100 rounded-2xl shadow-sm p-8">
        <h1 class="text-2xl font-bold text-center text-gray-900 mb-6">Log in</h1>

        <div id="errorBanner" class="error-message hidden text-sm mb-4 px-4 py-3 rounded-lg bg-red-50 text-red-700"></div>

        <div class="flex flex-col gap-4">
            <input type="email" id="email" placeholder="Email address" autocomplete="username"
                   class="px-4 py-3 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password"
                   class="px-4 py-3 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
            <button type="button" id="login-button"
                    class="px-4 py-3 text-sm font-medium text-white bg-green-500 rounded-lg hover:bg-green-600 transition">
                Log In
            </button>
            <p class="text-sm text-center text-gray-500">
                No account?
                <a href="signup.html" class="text-green-600 hover:underline">Create one</a>
            </p>
        </div>
    </div>

    <script>
        (function () {
            if (localStorage.getItem('token')) {
                window.location.href = 'dashboard.html';
                return;
            }

            const errEl = document.getElementById('errorBanner');

            document.getElementById('login-button').addEventListener('click', async function () {
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                errEl.classList.add('hidden');

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await response.json();

                    if (response.ok) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('userId', data.userId);
                        window.location.href = 'dashboard.html';
                        return;
                    }

                    errEl.textContent = data.error || 'Login failed';
                    errEl.classList.remove('hidden');
                } catch (e) {
                    errEl.textContent = 'Server error. Please try again.';
                    errEl.classList.remove('hidden');
                }
            });
        })();
    </script>
</body>
</html>
