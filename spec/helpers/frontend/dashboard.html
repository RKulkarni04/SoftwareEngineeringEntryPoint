<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EntryPoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-white text-gray-800">

    <header class="flex items-center px-8 py-4 border-b border-gray-100 shadow-sm">
        <span class="text-xl font-bold text-gray-900">EntryPoint</span>
        <nav class="ml-auto flex items-center gap-4">
            <a href="landing.html" class="text-sm text-gray-600 hover:text-green-600">Home</a>
            <a href="chat.html" id="nav-chat" class="text-sm text-gray-600 hover:text-green-600">Chat</a>
            <button type="button" id="logoutBtn" class="text-sm px-4 py-2 text-white bg-red-500 rounded-lg hover:bg-red-600">
                Logout
            </button>
        </nav>
    </header>

    <main class="max-w-2xl mx-auto px-6 py-12">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Dashboard</h1>
        <p id="welcomeLine" class="text-gray-500 mb-8">Welcome back.</p>

        <div class="grid gap-4 sm:grid-cols-2">
            <a href="chat.html" class="block p-6 border border-gray-100 rounded-xl shadow-sm hover:border-green-200 hover:bg-green-50 transition">
                <h2 class="font-semibold text-gray-900 mb-1">Chat</h2>
                <p class="text-sm text-gray-500">Continue or start LLM conversations.</p>
            </a>
            <div class="p-6 border border-gray-100 rounded-xl shadow-sm bg-gray-50">
                <h2 class="font-semibold text-gray-900 mb-2">Progress</h2>
                <ul id="progressList" class="text-sm text-gray-600 list-disc list-inside"></ul>
                <p id="progressEmpty" class="text-sm text-gray-400 hidden">No progress records yet.</p>
            </div>
        </div>
    </main>

    <script>
        (function () {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            const uid = localStorage.getItem('userId');
            if (uid) {
                document.getElementById('welcomeLine').textContent = 'Welcome back (user #' + uid + ').';
            }

            document.getElementById('logoutBtn').addEventListener('click', function () {
                localStorage.removeItem('token');
                localStorage.removeItem('userId');
                window.location.href = 'landing.html';
            });

            fetch('/api/progress', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    const ul = document.getElementById('progressList');
                    const empty = document.getElementById('progressEmpty');
                    if (!data.progress || data.progress.length === 0) {
                        empty.classList.remove('hidden');
                        return;
                    }
                    data.progress.forEach(function (row) {
                        const li = document.createElement('li');
                        li.textContent = row.assignment + ': ' + row.score;
                        ul.appendChild(li);
                    });
                })
                .catch(function () {
                    document.getElementById('progressEmpty').textContent = 'Could not load progress.';
                    document.getElementById('progressEmpty').classList.remove('hidden');
                });
        })();
    </script>
</body>
</html>
