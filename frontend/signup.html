<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - EntryPoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="flex flex-col min-h-screen bg-white">

    <header class="flex items-center px-8 py-4 border-b border-gray-100 shadow-sm">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-green-500 rounded-lg flex items-center justify-center">
                <span class="text-white font-bold text-sm">EP</span>
            </div>
            <span class="text-xl font-bold text-gray-900">EntryPoint</span>
        </div>
        <a href="landing.html" class="ml-auto text-sm font-medium text-gray-500 hover:text-green-600 transition">← Back to Home</a>
    </header>

    <main class="flex-1 flex flex-col justify-center items-center px-6 py-16 bg-gradient-to-b from-white to-green-50">
        <div class="w-full max-w-sm bg-white border border-gray-100 rounded-2xl shadow-sm p-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-1">Create account</h1>
            <p class="text-sm text-gray-500 mb-6">Join EntryPoint and start learning smarter</p>

            <div id="errorMsg" class="hidden text-red-500 text-xs mb-4 bg-red-50 px-3 py-2 rounded-lg"></div>
            <div id="successMsg" class="hidden text-green-600 text-xs mb-4 bg-green-50 px-3 py-2 rounded-lg"></div>

            <div class="flex flex-col gap-3">
                <input type="text" id="name" placeholder="Full name"
                       class="px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
                <input type="email" id="email" placeholder="Email address"
                       class="px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
                <input type="password" id="password" placeholder="Password"
                       class="px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
                <button onclick="signupUser()" class="px-4 py-2 text-sm font-medium text-white bg-green-500 rounded-lg hover:bg-green-600 transition mt-1">
                    Create Account
                </button>
                <p class="text-xs text-center text-gray-400">Already have an account?
                    <a href="landing.html" class="text-green-600 hover:underline">Log in</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        async function signupUser() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    successMsg.classList.remove('hidden');
                    successMsg.textContent = 'Account created! Redirecting to login...';
                    setTimeout(() => window.location.href = 'landing.html', 2000);
                } else {
                    errorMsg.classList.remove('hidden');
                    errorMsg.textContent = data.error || 'Signup failed';
                }
            } catch (err) {
                errorMsg.classList.remove('hidden');
                errorMsg.textContent = 'Server error. Please try again.';
            }
        }
    </script>
</body>
</html>
