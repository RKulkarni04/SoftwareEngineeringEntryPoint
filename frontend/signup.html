<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up – EntryPoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Cinzel:wght@400;500;600&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #8B6310;
            --gold-light: #B8860B;
            --ivory: #FAF7F0;
            --ivory-dark: #F2EDE0;
            --parchment: #E8DFC8;
            --ink: #1C1612;
            --ink-soft: #3D3025;
            --ink-muted: #7A6A55;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'EB Garamond', Georgia, serif;
            background: var(--ivory);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(ellipse at 70% 10%, rgba(180,145,60,0.07) 0%, transparent 60%),
                              radial-gradient(ellipse at 20% 90%, rgba(180,145,60,0.05) 0%, transparent 50%);
        }

        .ep-header {
            background: var(--ivory);
            border-bottom: 1px solid var(--parchment);
            padding: 0 2rem;
            height: 60px;
            display: flex;
            align-items: center;
        }
        .ep-logo-mark {
            width: 32px; height: 32px;
            background: var(--gold);
            border-radius: 5px;
            display: flex; align-items: center; justify-content: center;
        }
        .ep-logo-mark svg { width: 16px; height: 16px; fill: var(--ivory); }
        .ep-logo-name {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: 0.05em;
            text-decoration: none;
            margin-left: 0.6rem;
        }
        .btn-ghost {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-muted);
            background: transparent;
            border: 1px solid var(--parchment);
            border-radius: 4px;
            padding: 0.4rem 0.85rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s;
        }
        .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 1.5rem;
        }

        .ep-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border: 1px solid var(--parchment);
            border-radius: 10px;
            padding: 2.5rem 2rem;
            box-shadow: 0 4px 24px rgba(28,22,18,0.07);
        }

        .ep-card-eyebrow {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gold);
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .ep-card h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 600;
            color: var(--ink);
            text-align: center;
            margin-bottom: 0.3rem;
        }

        .ep-card .subtitle {
            font-family: 'EB Garamond', serif;
            font-size: 0.95rem;
            color: var(--ink-muted);
            text-align: center;
            margin-bottom: 1.75rem;
            line-height: 1.5;
        }

        .ep-input {
            width: 100%;
            background: var(--ivory);
            border: 1px solid var(--parchment);
            border-radius: 4px;
            padding: 0.65rem 0.9rem;
            font-family: 'EB Garamond', serif;
            font-size: 1rem;
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .ep-input:focus { border-color: var(--gold); background: white; }
        .ep-input::placeholder { color: var(--ink-muted); }

        .btn-gold {
            width: 100%;
            background: var(--gold);
            color: var(--ivory);
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            border: none;
            border-radius: 4px;
            padding: 0.75rem 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-gold:hover { background: var(--gold-light); }

        #messageBox {
            font-family: 'EB Garamond', serif;
            font-size: 0.95rem;
            border-radius: 4px;
            padding: 0.5rem 0.85rem;
            margin-bottom: 1rem;
        }
        .msg-success { background: #F0FAF0; color: #2A5A2A; border: 1px solid #B8D8B8; }
        .msg-error   { background: #FFF5F5; color: #7A2020; border: 1px solid #F5C6C6; }

        .ep-divider {
            border: none;
            border-top: 1px solid var(--parchment);
            margin: 1.25rem 0;
        }

        .ep-link {
            font-family: 'EB Garamond', serif;
            font-size: 0.95rem;
            color: var(--ink-muted);
            text-align: center;
        }
        .ep-link a {
            color: var(--gold);
            text-decoration: none;
        }
        .ep-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header class="ep-header">
        <a href="landing.html" style="display:flex;align-items:center;text-decoration:none;">
            <div class="ep-logo-mark">
                <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2L3 7v11h14V7L10 2zm0 2.2l5 3.5V17H5V7.7l5-3.5z"/></svg>
            </div>
            <span class="ep-logo-name">EntryPoint</span>
        </a>
        <a href="landing.html" class="btn-ghost" style="margin-left:auto;">Return Home</a>
    </header>

    <main>
        <div class="ep-card">
            <div class="ep-card-eyebrow">Enroll</div>
            <h1>Create an Account</h1>
            <p class="subtitle">Join EntryPoint and begin your studies.</p>

            <div id="messageBox" class="hidden"></div>

            <div class="flex flex-col gap-3">
                <input
                    type="text"
                    id="name"
                    placeholder="Full name"
                    class="ep-input"
                >
                <input
                    type="email"
                    id="email"
                    placeholder="Email address"
                    class="ep-input"
                >
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    class="ep-input"
                >

                <button
                    onclick="registerUser()"
                    class="btn-gold"
                    style="margin-top:0.5rem;"
                >
                    Create Account
                </button>
            </div>

            <hr class="ep-divider">

            <p class="ep-link">Already enrolled? <a href="landing.html">Sign in</a></p>
        </div>
    </main>

    <script>
        async function registerUser() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const messageBox = document.getElementById('messageBox');

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                messageBox.classList.remove('hidden', 'msg-success', 'msg-error');

                if (response.ok) {
                    messageBox.className = 'msg-success';
                    messageBox.textContent = data.message || 'Account created successfully';
                    setTimeout(() => {
                        window.location.href = 'landing.html';
                    }, 1000);
                } else {
                    messageBox.className = 'msg-error';
                    messageBox.textContent = data.error || 'Signup failed';
                }
            } catch (err) {
                messageBox.classList.remove('hidden');
                messageBox.className = 'msg-error';
                messageBox.textContent = 'Server error. Please try again.';
            }
        }
    </script>
</body>
</html>
