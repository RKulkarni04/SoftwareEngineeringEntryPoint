<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – EntryPoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="flex flex-col min-h-screen bg-gradient-to-b from-white to-green-50 text-gray-800">

    <!-- Navbar -->
    <header class="flex items-center px-8 py-4 border-b border-gray-100 shadow-sm bg-white">
        <a href="landing.html" class="flex items-center gap-2">
            <div class="w-8 h-8 bg-green-500 rounded-lg flex items-center justify-center">
                <span class="text-white font-bold text-sm">EP</span>
            </div>
            <span class="text-xl font-bold text-gray-900">EntryPoint</span>
        </a>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-16">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-100 p-8">

            <!-- REQUEST RESET VIEW -->
            <div id="requestView">
                <h2 class="text-2xl font-bold text-gray-900 mb-2">Forgot your password?</h2>
                <p class="text-sm text-gray-500 mb-6">Enter your email and we'll send you a reset link.</p>

                <div id="requestMsg" class="hidden text-sm mb-4 px-4 py-3 rounded-lg"></div>

                <div class="flex flex-col gap-4">
                    <input type="email" id="resetEmail" placeholder="Email address"
                           class="px-4 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
                    <button onclick="requestReset()"
                            class="px-4 py-2.5 text-sm font-medium text-white bg-green-500 rounded-lg hover:bg-green-600 transition">
                        Send Reset Link
                    </button>
                    <a href="landing.html" class="text-center text-sm text-green-600 hover:underline">Back to login</a>
                </div>
            </div>

            <!-- RESET PASSWORD VIEW (shown when ?token= is in URL) -->
            <div id="resetView" class="hidden">
                <h2 class="text-2xl font-bold text-gray-900 mb-2">Set a new password</h2>
                <p class="text-sm text-gray-500 mb-6">Choose a strong new password for your account.</p>

                <div id="resetMsg" class="hidden text-sm mb-4 px-4 py-3 rounded-lg"></div>

                <div class="flex flex-col gap-4">
                    <input type="password" id="newPassword" placeholder="New password"
                           class="px-4 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
                    <input type="password" id="confirmPassword" placeholder="Confirm new password"
                           class="px-4 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
                    <button onclick="submitReset()"
                            class="px-4 py-2.5 text-sm font-medium text-white bg-green-500 rounded-lg hover:bg-green-600 transition">
                        Reset Password
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        // Show the correct view based on whether a token is present
        if (token) {
            document.getElementById('requestView').classList.add('hidden');
            document.getElementById('resetView').classList.remove('hidden');
        }

        function showMsg(id, text, isError) {
            const el = document.getElementById(id);
            el.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-green-50', 'text-green-700');
            el.classList.add(isError ? 'bg-red-50' : 'bg-green-50', isError ? 'text-red-600' : 'text-green-700');
            el.textContent = text;
        }

        async function requestReset() {
            const email = document.getElementById('resetEmail').value.trim();
            if (!email) return showMsg('requestMsg', 'Please enter your email address.', true);

            const res = await fetch('/api/password-reset/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            showMsg('requestMsg', data.message || data.error, !res.ok);
        }

        async function submitReset() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!newPassword || !confirmPassword) return showMsg('resetMsg', 'Please fill in both fields.', true);
            if (newPassword !== confirmPassword) return showMsg('resetMsg', 'Passwords do not match.', true);
            if (newPassword.length < 8) return showMsg('resetMsg', 'Password must be at least 8 characters.', true);

            const res = await fetch('/api/password-reset/confirm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, new_password: newPassword })
            });
            const data = await res.json();
            showMsg('resetMsg', data.message || data.error, !res.ok);

            if (res.ok) {
                setTimeout(() => window.location.href = 'landing.html', 2000);
            }
        }
    </script>
</body>
</html>
