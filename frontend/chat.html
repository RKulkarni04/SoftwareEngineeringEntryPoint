<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - EntryPoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex flex-col min-h-screen m-0">

    <!-- Top bar -->
    <header class="flex items-center gap-4 px-5 py-4 bg-gray-100 border-b border-gray-300">
        <a href="landing.html" class="px-5 py-2 text-white bg-green-500 rounded hover:bg-green-700">Home</a>
        <a href="chat.html" class="px-5 py-2 text-white bg-green-500 rounded hover:bg-green-700">New Chat</a>
        <button onclick="logout()" class="ml-auto px-5 py-2 text-white bg-red-500 rounded hover:bg-red-700">
            Logout
        </button>
    </header>

    <div class="flex flex-1 overflow-hidden">

        <!-- Sidebar -->
        <aside class="w-48 bg-gray-50 border-r border-gray-300 p-3">
            <h2 class="text-sm text-gray-600 mb-2">Previous Chats</h2>
            <div class="bg-green-100 p-2 rounded text-sm">Current Chat</div>
        </aside>

        <!-- Main chat -->
        <main class="flex-1 flex flex-col">

            <!-- Messages -->
            <div id="messages" class="flex-1 overflow-y-auto p-5 flex flex-col gap-3">
                <div class="text-gray-400 text-sm text-center">
                    Start a conversation below
                </div>
            </div>

            <!-- Input -->
            <div class="flex gap-2 p-4 border-t">
                <input
                    id="chatInput"
                    type="text"
                    placeholder="Type a message..."
                    class="flex-1 px-4 py-2 border rounded"
                    onkeydown="if(event.key==='Enter') sendMessage()"
                >
                <button onclick="sendMessage()" class="px-5 py-2 bg-green-500 text-white rounded hover:bg-green-700">
                    Send →
                </button>
            </div>

        </main>
    </div>

<script>

function addMessage(text, isUser) {
    const messages = document.getElementById('messages');

    const div = document.createElement('div');
    div.className = isUser
        ? 'self-end bg-green-500 text-white px-4 py-2 rounded max-w-xs'
        : 'self-start bg-gray-200 text-black px-4 py-2 rounded max-w-xs';

    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();

    if (!text) return;

    input.value = '';
    addMessage(text, true);

    // typing indicator
    addMessage('...', false);

    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ message: text })
        });

        const data = await response.json();

        const messages = document.getElementById('messages');
        messages.removeChild(messages.lastChild);

        if (!response.ok) {
            addMessage(data.reply || data.error || 'Server error', false);
            return;
        }

        addMessage(data.reply, false);

    } catch (err) {
        const messages = document.getElementById('messages');
        messages.removeChild(messages.lastChild);
        addMessage('Error connecting to server.', false);
    }
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('userId');
    window.location.href = 'landing.html';
}

</script>

</body>
</html>
