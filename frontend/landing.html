<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EntryPoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .logo-text { letter-spacing: -0.5px; }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-white text-gray-800">

    <header class="flex items-center px-8 py-4 border-b border-gray-100 shadow-sm bg-white">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-green-500 rounded-lg flex items-center justify-center">
                <span class="text-white font-bold text-sm">EP</span>
            </div>
            <span class="text-xl font-bold logo-text text-gray-900">EntryPoint</span>
        </div>

        <nav class="flex items-center gap-6 ml-10">
            <a href="landing.html" class="text-sm font-medium text-gray-600 hover:text-green-600 transition">Home</a>
            <a href="chat.html" id="nav-chat" class="text-sm font-medium text-gray-600 hover:text-green-600 transition">Chat</a>
        </nav>

        <div class="ml-auto flex items-center gap-3">
            <span id="welcomeText" class="hidden text-sm text-gray-500"></span>
            <a href="login.html" id="loginLink" class="px-4 py-2 text-sm font-medium text-white bg-green-500 rounded-lg hover:bg-green-600 transition shadow-sm">
                Login
            </a>
            <a href="dashboard.html" id="dashboardLink" class="hidden px-4 py-2 text-sm font-medium text-white bg-green-600 rounded-lg hover:bg-green-700 transition">
                Dashboard
            </a>
            <button type="button" id="logoutBtn" class="hidden px-4 py-2 text-sm font-medium text-white bg-red-500 rounded-lg hover:bg-red-600 transition shadow-sm">
                Logout
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center px-6 py-16 bg-gradient-to-b from-white to-green-50">
        <div class="flex items-center gap-2 px-3 py-1 bg-green-100 text-green-700 text-xs font-medium rounded-full mb-6">
            <span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span>
            AI-Powered Learning Assistant
        </div>

        <h1 class="text-5xl font-bold text-center text-gray-900 mb-4 leading-tight">
            Your Intelligent <br>
            <span class="text-green-500">Entry Point</span>
        </h1>
        <p class="text-gray-500 text-center text-base max-w-md mb-10">
            Ask anything, learn faster. EntryPoint connects you with AI to help you study smarter.
        </p>

        <div class="flex items-center gap-2 w-full max-w-lg bg-white border border-gray-200 rounded-xl shadow-sm px-4 py-3">
            <input type="text" id="chatInput" placeholder="Ask a question to get started..."
                   class="flex-1 text-sm text-gray-700 outline-none bg-transparent"
                   onkeydown="if(event.key==='Enter') goToChat()">
            <button type="button" onclick="goToChat()" class="px-4 py-2 text-sm font-medium text-white bg-green-500 rounded-lg hover:bg-green-600 transition">
                Send →
            </button>
        </div>

        <div id="chatHistory" class="hidden w-full max-w-lg mt-10">
            <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-3">Your conversations</h2>
            <ul id="chatList" class="bg-white border border-gray-100 rounded-xl divide-y divide-gray-100 shadow-sm">
            </ul>
            <p id="chatListEmpty" class="text-sm text-gray-400 mt-2 hidden">Open Chat to start a conversation.</p>
        </div>

        <div id="featureCards" class="grid grid-cols-3 gap-4 mt-12 max-w-lg w-full">
            <div class="bg-white border border-gray-100 rounded-xl p-4 shadow-sm text-center">
                <div class="text-2xl mb-2">🤖</div>
                <p class="text-xs font-medium text-gray-700">AI Powered</p>
            </div>
            <div class="bg-white border border-gray-100 rounded-xl p-4 shadow-sm text-center">
                <div class="text-2xl mb-2">⚡</div>
                <p class="text-xs font-medium text-gray-700">Instant Answers</p>
            </div>
            <div class="bg-white border border-gray-100 rounded-xl p-4 shadow-sm text-center">
                <div class="text-2xl mb-2">🔒</div>
                <p class="text-xs font-medium text-gray-700">Secure Login</p>
            </div>
        </div>
    </main>

    <script>
        const loginLink = document.getElementById('loginLink');
        const dashboardLink = document.getElementById('dashboardLink');
        const logoutBtn = document.getElementById('logoutBtn');

        function authHeaders() {
            const t = localStorage.getItem('token');
            return t ? { 'Authorization': 'Bearer ' + t } : {};
        }

        window.onload = function () {
            const token = localStorage.getItem('token');
            if (token) {
                loginLink.classList.add('hidden');
                dashboardLink.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');
                document.getElementById('chatHistory').classList.remove('hidden');
                document.getElementById('featureCards').classList.add('hidden');
                loadConversationPreview();
            }
        };

        function loadConversationPreview() {
            fetch('/api/conversations', { headers: authHeaders() })
                .then(function (r) {
                    if (!r.ok) throw new Error('fail');
                    return r.json();
                })
                .then(function (data) {
                    const ul = document.getElementById('chatList');
                    ul.innerHTML = '';
                    const list = data.conversations || [];
                    if (list.length === 0) {
                        document.getElementById('chatListEmpty').classList.remove('hidden');
                        return;
                    }
                    document.getElementById('chatListEmpty').classList.add('hidden');
                    list.slice(0, 5).forEach(function (c) {
                        const li = document.createElement('li');
                        li.className = 'px-4 py-3 text-sm text-gray-700 hover:bg-green-50 cursor-pointer flex items-center gap-2 transition';
                        li.innerHTML = '<span class="w-2 h-2 bg-green-400 rounded-full"></span><span>' +
                            (c.title || 'Chat') + '</span>';
                        li.onclick = function () {
                            localStorage.setItem('openConversationId', String(c.id));
                            window.location.href = 'chat.html';
                        };
                        ul.appendChild(li);
                    });
                })
                .catch(function () {
                    document.getElementById('chatListEmpty').classList.remove('hidden');
                });
        }

        logoutBtn.addEventListener('click', function () {
            localStorage.removeItem('token');
            localStorage.removeItem('userId');
            localStorage.removeItem('openConversationId');
            loginLink.classList.remove('hidden');
            dashboardLink.classList.add('hidden');
            logoutBtn.classList.add('hidden');
            document.getElementById('chatHistory').classList.add('hidden');
            document.getElementById('featureCards').classList.remove('hidden');
        });

        function goToChat() {
            const msg = document.getElementById('chatInput').value;
            if (!msg.trim()) return;
            if (!localStorage.getItem('token')) {
                window.location.href = 'login.html';
                return;
            }
            localStorage.setItem('firstMessage', msg);
            window.location.href = 'chat.html';
        }
    </script>
</body>
</html>
