<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – EntryPoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Cinzel:wght@400;500;600&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #8B6310;
            --gold-light: #B8860B;
            --ivory: #FAF7F0;
            --ivory-dark: #F2EDE0;
            --parchment: #E8DFC8;
            --ink: #1C1612;
            --ink-soft: #3D3025;
            --ink-muted: #7A6A55;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'EB Garamond', Georgia, serif;
            background: var(--ivory);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(ellipse at 70% 10%, rgba(180,145,60,0.07) 0%, transparent 60%),
                              radial-gradient(ellipse at 20% 90%, rgba(180,145,60,0.05) 0%, transparent 50%);
        }

        .ep-header {
            background: var(--ivory);
            border-bottom: 1px solid var(--parchment);
            padding: 0 2rem;
            height: 60px;
            display: flex;
            align-items: center;
        }
        .ep-logo-mark {
            width: 32px; height: 32px;
            background: var(--gold);
            border-radius: 5px;
            display: flex; align-items: center; justify-content: center;
        }
        .ep-logo-mark svg { width: 16px; height: 16px; fill: var(--ivory); }
        .ep-logo-name {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: 0.05em;
            text-decoration: none;
            margin-left: 0.6rem;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 1.5rem;
        }

        .ep-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border: 1px solid var(--parchment);
            border-radius: 10px;
            padding: 2.5rem 2rem;
            box-shadow: 0 4px 24px rgba(28,22,18,0.07);
        }

        .ep-card-eyebrow {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 0.4rem;
        }

        .ep-card h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.9rem;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 0.35rem;
        }

        .ep-card .subtitle {
            font-family: 'EB Garamond', serif;
            font-size: 0.95rem;
            color: var(--ink-muted);
            line-height: 1.55;
            margin-bottom: 1.5rem;
        }

        .ep-input {
            width: 100%;
            background: var(--ivory);
            border: 1px solid var(--parchment);
            border-radius: 4px;
            padding: 0.65rem 0.9rem;
            font-family: 'EB Garamond', serif;
            font-size: 1rem;
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .ep-input:focus { border-color: var(--gold); background: white; }
        .ep-input::placeholder { color: var(--ink-muted); }

        .btn-gold {
            width: 100%;
            background: var(--gold);
            color: var(--ivory);
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            border: none;
            border-radius: 4px;
            padding: 0.75rem 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-gold:hover { background: var(--gold-light); }

        .ep-msg {
            font-family: 'EB Garamond', serif;
            font-size: 0.95rem;
            border-radius: 4px;
            padding: 0.5rem 0.85rem;
            margin-bottom: 1rem;
        }
        .msg-success { background: #F0FAF0; color: #2A5A2A; border: 1px solid #B8D8B8; }
        .msg-error   { background: #FFF5F5; color: #7A2020; border: 1px solid #F5C6C6; }

        .ep-back-link {
            display: block;
            text-align: center;
            font-family: 'EB Garamond', serif;
            font-size: 0.95rem;
            color: var(--gold);
            text-decoration: none;
            margin-top: 0.75rem;
        }
        .ep-back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header class="ep-header">
        <a href="landing.html" style="display:flex;align-items:center;text-decoration:none;">
            <div class="ep-logo-mark">
                <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2L3 7v11h14V7L10 2zm0 2.2l5 3.5V17H5V7.7l5-3.5z"/></svg>
            </div>
            <span class="ep-logo-name">EntryPoint</span>
        </a>
    </header>

    <main>
        <div class="ep-card">

            <!-- REQUEST RESET VIEW -->
            <div id="requestView">
                <div class="ep-card-eyebrow">Account Recovery</div>
                <h2>Forgot your password?</h2>
                <p class="subtitle">Enter your email address and we will send you a reset link.</p>

                <div id="requestMsg" class="hidden ep-msg"></div>

                <div class="flex flex-col gap-3">
                    <input type="email" id="resetEmail" placeholder="Email address" class="ep-input">
                    <button onclick="requestReset()" class="btn-gold">Send Reset Link</button>
                    <a href="landing.html" class="ep-back-link">Return to sign in</a>
                </div>
            </div>

            <!-- RESET PASSWORD VIEW (shown when ?token= is in URL) -->
            <div id="resetView" class="hidden">
                <div class="ep-card-eyebrow">Account Recovery</div>
                <h2>Set a new password</h2>
                <p class="subtitle">Choose a strong new password for your account.</p>

                <div id="resetMsg" class="hidden ep-msg"></div>

                <div class="flex flex-col gap-3">
                    <input type="password" id="newPassword" placeholder="New password" class="ep-input">
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" class="ep-input">
                    <button onclick="submitReset()" class="btn-gold">Reset Password</button>
                </div>
            </div>

        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (token) {
            document.getElementById('requestView').classList.add('hidden');
            document.getElementById('resetView').classList.remove('hidden');
        }

        function showMsg(id, text, isError) {
            const el = document.getElementById(id);
            el.classList.remove('hidden', 'msg-success', 'msg-error');
            el.classList.add(isError ? 'msg-error' : 'msg-success');
            el.textContent = text;
        }

        async function requestReset() {
            const email = document.getElementById('resetEmail').value.trim();
            if (!email) return showMsg('requestMsg', 'Please enter your email address.', true);

            const res = await fetch('/api/password-reset/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            showMsg('requestMsg', data.message || data.error, !res.ok);
        }

        async function submitReset() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!newPassword || !confirmPassword) return showMsg('resetMsg', 'Please fill in both fields.', true);
            if (newPassword !== confirmPassword) return showMsg('resetMsg', 'Passwords do not match.', true);
            if (newPassword.length < 8) return showMsg('resetMsg', 'Password must be at least 8 characters.', true);

            const res = await fetch('/api/password-reset/confirm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, new_password: newPassword })
            });
            const data = await res.json();
            showMsg('resetMsg', data.message || data.error, !res.ok);

            if (res.ok) {
                setTimeout(() => window.location.href = 'landing.html', 2000);
            }
        }
    </script>
</body>
</html>
